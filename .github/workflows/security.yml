name: DevSecOps Pipeline - SAST & Secrets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Codice di checkout
        uses: actions/checkout@v4

      - name: 🔒 Esegui Secret Scanning con GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Esegui Analisi Statica (SAST) con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto